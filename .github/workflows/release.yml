name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      - name: Verify package.json version matches tag
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [[ "${pkg_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "ERROR: package.json の version (${pkg_version}) とタグ (${GITHUB_REF_NAME}) が一致しません"
            exit 1
          fi

      - name: Embed version into install.sh
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "ERROR: 不正なバージョン形式: ${version}"
            exit 1
          }
          sed -i "s/^INSTALL_VERSION=\"__VERSION__\"/INSTALL_VERSION=\"${version}\"/" install.sh

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          generate_release_notes: true
          files: install.sh
