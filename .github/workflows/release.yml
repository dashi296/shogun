name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          submodules: recursive
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'

      - name: Verify package.json version matches tag
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [[ "${pkg_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "ERROR: package.json の version (${pkg_version}) とタグ (${GITHUB_REF_NAME}) が一致しません"
            exit 1
          fi

      - name: Embed version into install.sh
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "ERROR: 不正なバージョン形式: ${version}"
            exit 1
          }
          sed -i "s/^INSTALL_VERSION=\"__VERSION__\"/INSTALL_VERSION=\"${version}\"/" install.sh

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          generate_release_notes: true
          files: install.sh
