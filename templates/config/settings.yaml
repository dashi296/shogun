# Shogun プロジェクト設定
version: "1.0"

agents:
  ashigaru_count: 3        # 足軽の人数 (1-7)
  taisho_model: opus       # 大将のモデル (opus/sonnet)
  worker_model: sonnet     # 足軽・軍師・目付のモデル

agmsg:
  cmd_name: agmsg           # agmsg のインストールコマンド名（複数 <cmd> がある環境向け）

# Bloom's Taxonomy に基づくエージェントルーティング基準
# L1: 記憶 / L2: 理解 / L3: 適用 / L4: 分析 / L5: 評価 / L6: 創造
capability_tiers:
  ashigaru:
    bloom_max: 3           # L1-L3: 記憶・理解・適用（定型実装・既知手順・単純変更）
  gunshi:
    bloom_min: 4           # L4-L6: 分析・評価・創造（設計・リスク分析・新規考案）
  model_bloom_ceiling:
    haiku: 3               # Haiku はL3まで
    sonnet: 5              # Sonnet はL5まで
    opus: 6                # Opus はL6まで

persona:
  sengoku: true             # 戦国風口調を有効にする（false にすると通常口調）

language: ja
startup:
  skip_permissions: false  # true にする場合は意味を理解した上で明示的に変更してください
logging:
  level: info
  dir: .shogun/logs/

# Agent Self-Watch（3段階エスカレーション自動復旧）
# enabled: true にすると、無応答エージェントを自動復旧する ASW が有効になる
# MCP プル型移行後: エージェントが MCP ツール呼び出し中は tmux アクティビティが
# 更新されないため、従来の 5/10/15 分より長めのタイムアウトを推奨する。
escalation_policy:
  enabled: false
  phase1_nudge_sec: 600      # 10分: 催促メッセージを送る
  phase2_interrupt_sec: 1200 # 20分: Ctrl-C で中断
  phase3_clear_sec: 1800     # 30分: /clear でリセット
